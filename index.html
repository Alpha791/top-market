<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>The Hive 🐝 – Dark Marketplace</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Cloudinary -->
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== ALL CSS HERE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(145deg, #0f0c29, #302b63, #24243e); color: #e0e0e0; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 1.8rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #ffaa66; }
        .auth-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .auth-buttons button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; color: #fff; transition: 0.2s; }
        .auth-buttons button:hover { background: rgba(255,255,255,0.2); }
        #userInfo { display: none; align-items: center; gap: 10px; color: white; }
        #userInfo span { font-weight: 600; }
        #logoutBtn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .role-badge { background: #ffaa66; color: #0f0c29; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; }
        .cart-icon { position: relative; color: white; font-size: 1.4rem; cursor: pointer; margin-left: 10px; }
        .cart-count { position: absolute; top: -8px; right: -8px; background: #ff0; color: #333; border-radius: 50%; padding: 0 6px; font-size: 0.7rem; font-weight: bold; }
        .container { max-width: 1300px; margin: 20px auto; padding: 0 15px; }
        .live-section, .post-form, .listings { background: rgba(255,255,255,0.07); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .live-section h2, .post-form h2, .listings h2 { color: #ffaa66; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 16px; }
        .live-container { text-align: center; }
        .live-frame-container { width: 100%; max-width: 640px; height: 360px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
        .live-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
        .live-btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #ff6b00; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-secondary { background: linear-gradient(135deg, #475569, #334155); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 40px; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(71,85,105,0.4); }
        .live-status { margin-top: 10px; font-weight: 600; color: #27ae60; }
        .live-info { font-size: 0.9rem; color: #aaa; }
        .form-card input, .form-card textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: rgba(0,0,0,0.3); color: #f0f0f0; }
        .form-card input::placeholder, .form-card textarea::placeholder { color: #aaa; }
        .form-card input:focus, .form-card textarea:focus { outline: none; border-color: #ff6b00; box-shadow: 0 0 0 3px rgba(255,107,0,0.2); }
        .file-label { display: block; background: rgba(255,255,255,0.05); padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 10px; border: 1px dashed rgba(255,255,255,0.2); color: #ccc; }
        .image-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .image-preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); transition: 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: rgba(255,107,0,0.3); }
        .card-images { display: flex; gap: 4px; padding: 8px; background: rgba(0,0,0,0.2); overflow-x: auto; }
        .card-images img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .card-content { padding: 12px; }
        .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; color: #fff; }
        .card-price { color: #ffaa66; font-weight: 700; font-size: 1.1rem; margin: 4px 0; }
        .card-desc { font-size: 0.85rem; color: #bbb; margin-bottom: 8px; }
        .seller-info { background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; margin: 8px 0; color: #ccc; }
        .seller-info i { color: #ffaa66; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-buy, .btn-whatsapp, .btn-add-cart { flex: 1; padding: 8px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: transform 0.2s; }
        .btn-buy { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(245,158,11,0.4); }
        .btn-whatsapp { background: #25D366; color: white; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,211,102,0.4); }
        .btn-add-cart { background: #3498db; color: white; }
        .btn-add-cart:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(52,152,219,0.4); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e2f; padding: 24px; border-radius: 16px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); color: #eee; }
        .modal-content h3 { color: #ffaa66; margin-bottom: 16px; }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: rgba(0,0,0,0.3); color: #f0f0f0; }
        .modal-content input::placeholder { color: #aaa; }
        .modal-content button { width: 100%; padding: 12px; border: none; border-radius: 30px; background: #ff6b00; color: white; font-weight: 600; cursor: pointer; }
        .modal-content button:hover { opacity: 0.9; }
        .role-select { display: flex; gap: 20px; margin: 10px 0; }
        .role-select label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .close { float: right; font-size: 1.6rem; cursor: pointer; color: #aaa; }
        .close:hover { color: #ff6b00; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; }
        .cart-total { font-weight: 700; font-size: 1.2rem; margin-top: 12px; color: #ffaa66; }
        #orderSummary { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 3px solid #ff6b00; color: #ddd; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
        .toast { background: rgba(30,30,47,0.95); color: white; padding: 12px 18px; border-radius: 8px; animation: slideIn 0.3s ease; border-left: 4px solid; }
        .toast-success { border-color: #27ae60; }
        .toast-error { border-color: #e74c3c; }
        .toast-warning { border-color: #f39c12; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 700px) { .listings-grid { grid-template-columns: repeat(2,1fr); } .live-frame-container { height: 220px; } .toast-container { top: auto; bottom: 20px; right: 10px; left: 10px; max-width: none; } .card-actions { flex-direction: column; } .btn-whatsapp, .btn-buy, .btn-add-cart { width: 100%; } }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <header>
        <div class="logo"><i class="fas fa-store"></i> The Hive</div>
        <div class="auth-buttons">
            <button id="showLoginBtn">Login</button>
            <button id="showSignupBtn">Sign Up</button>
            <div id="userInfo">
                <span id="userName"></span>
                <span id="userRole" class="role-badge"></span>
                <button id="logoutBtn">Logout</button>
            </div>
            <div class="cart-icon" id="cartIcon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </header>
    <div class="container">
        <!-- Live Section -->
        <section class="live-section">
            <h2><i class="fas fa-video"></i> Live Selling</h2>
            <div class="live-container">
                <div id="liveFrameContainer" class="live-frame-container" style="display:none;"></div>
                <div class="live-controls">
                    <button id="startLiveBtn" class="live-btn btn-primary">🔴 Start Live</button>
                    <button id="joinLiveBtn" class="live-btn btn-primary">👁️ Join</button>
                    <button id="endLiveBtn" class="live-btn btn-danger" style="display:none;">⏹️ End</button>
                    <button id="fullscreenBtn" class="live-btn btn-secondary" style="display:none;">⛶ Fullscreen</button>
                </div>
                <div id="liveStatus" class="live-status">⚡ Ready</div>
                <div id="liveInfo" class="live-info"></div>
            </div>
        </section>

        <!-- Sell Form (hidden for buyers) -->
        <section class="post-form" id="postForm">
            <h2><i class="fas fa-plus-circle"></i> Sell an Item</h2>
            <div class="form-card">
                <input type="text" id="itemTitle" placeholder="Title *">
                <textarea id="itemDesc" placeholder="Description *" rows="3"></textarea>
                <input type="number" id="itemPrice" placeholder="Price (KES) *">
                <input type="text" id="sellerName" placeholder="Your Name *">
                <input type="email" id="sellerEmail" placeholder="Your Email *">
                <input type="tel" id="sellerPhone" placeholder="Phone (WhatsApp) *">
                <label class="file-label"><i class="fas fa-cloud-upload-alt"></i> Up to 3 images</label>
                <input type="file" id="itemImages" accept="image/*" multiple style="display:none;">
                <div id="imagePreview" class="image-preview"></div>
                <button id="postItemBtn" class="btn-primary" style="width:100%; padding:12px;">Post Item</button>
            </div>
        </section>

        <!-- Listings -->
        <section class="listings">
            <h2><i class="fas fa-list-ul"></i> Available Items</h2>
            <div id="listingsGrid" class="listings-grid">Loading items...</div>
        </section>
    </div>

    <!-- Auth Modals -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Login</h3>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="doLoginBtn">Login</button>
        </div>
    </div>
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Create Account</h3>
            <input type="text" id="signupName" placeholder="Full Name">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <div class="role-select">
                <label><input type="radio" name="role" value="Buyer" checked> Buyer</label>
                <label><input type="radio" name="role" value="Seller"> Seller</label>
            </div>
            <button id="doSignupBtn">Sign Up</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" id="cartModalClose">&times;</span>
            <h3><i class="fas fa-shopping-cart"></i> Your Cart</h3>
            <div id="cartItems"></div>
            <div id="cartTotal" class="cart-total"></div>
            <button id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" id="orderModalClose">&times;</span>
            <h3><i class="fas fa-truck"></i> Place Order</h3>
            <input type="text" id="orderBuyerName" placeholder="Full Name *">
            <input type="tel" id="orderBuyerPhone" placeholder="Phone (WhatsApp) *">
            <input type="text" id="orderAddress" placeholder="Delivery Address *">
            <div id="orderSummary"></div>
            <button id="placeOrderBtn">📲 Send Order via WhatsApp</button>
        </div>
    </div>

    <script>
        // ==================== ALL JAVASCRIPT HERE ====================
        // (Paste the entire app.js content here – I'll provide it below)
        const firebaseConfig = {
            apiKey: "AIzaSyCfSi2_xpsl1GkVN-7HhMx3VJdCyQz6fBE",
            authDomain: "best-market-d2ef0.firebaseapp.com",
            projectId: "best-market-d2ef0",
            storageBucket: "best-market-d2ef0.firebasestorage.app",
            messagingSenderId: "350312625623",
            appId: "1:350312625623:web:a8423cca0f867d43c90792"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        console.log("✅ Firebase ready");

        let currentUser = null;
        let currentUserRole = '';
        let cart = JSON.parse(localStorage.getItem('thehive_cart')) || [];

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        function updateCartUI() {
            const countEl = document.getElementById('cartCount');
            if (countEl) countEl.textContent = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            localStorage.setItem('thehive_cart', JSON.stringify(cart));
        }

        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) existing.qty = (existing.qty || 1) + 1;
            else cart.push({ ...item, qty: 1 });
            updateCartUI();
            showToast('Added to cart!', 'success');
        }

        function renderCartModal() {
            const container = document.getElementById('cartItems');
            const totalSpan = document.getElementById('cartTotal');
            if (!container || !totalSpan) return;
            if (!cart.length) {
                container.innerHTML = '<p>Your cart is empty.</p>';
                totalSpan.textContent = '';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach((item, idx) => {
                const subtotal = item.price * (item.qty || 1);
                total += subtotal;
                html += `<div class="cart-item"><span>${item.title} x ${item.qty}</span><span>KES ${subtotal.toFixed(2)}</span><button onclick="removeFromCart(${idx})" style="background:none;border:none;color:red;cursor:pointer;">✕</button></div>`;
            });
            container.innerHTML = html;
            totalSpan.textContent = `Total: KES ${total.toFixed(2)}`;
        }
        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            updateCartUI();
            renderCartModal();
            showToast('Item removed', 'info');
        };

        function updateAuthUI(user) {
            currentUser = user;
            const loginBtn = document.getElementById('showLoginBtn');
            const signupBtn = document.getElementById('showSignupBtn');
            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');
            const userRole = document.getElementById('userRole');
            const postForm = document.getElementById('postForm');
            if (user) {
                if (loginBtn) loginBtn.style.display = 'none';
                if (signupBtn) signupBtn.style.display = 'none';
                if (userInfo) userInfo.style.display = 'flex';
                if (userName) userName.textContent = user.displayName || user.email.split('@')[0];
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const role = doc.data().role || 'Buyer';
                        currentUserRole = role;
                        if (userRole) userRole.textContent = role;
                        if (postForm) postForm.style.display = (role === 'Seller') ? 'block' : 'none';
                    }
                }).catch(() => {});
            } else {
                if (loginBtn) loginBtn.style.display = 'inline-block';
                if (signupBtn) signupBtn.style.display = 'inline-block';
                if (userInfo) userInfo.style.display = 'none';
                if (postForm) postForm.style.display = 'block';
                currentUserRole = '';
            }
        }

        function showModal(id) { const el = document.getElementById(id); if (el) el.style.display = 'flex'; }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        function safeOnClick(id, handler) {
            const el = document.getElementById(id);
            if (el) el.onclick = handler;
            else console.warn(`Element #${id} not found`);
        }

        document.addEventListener('DOMContentLoaded', function() {
            safeOnClick('showLoginBtn', () => showModal('loginModal'));
            safeOnClick('showSignupBtn', () => showModal('signupModal'));
            safeOnClick('logoutBtn', () => auth.signOut());

            safeOnClick('doLoginBtn', async () => {
                const email = document.getElementById('loginEmail').value;
                const pwd = document.getElementById('loginPassword').value;
                try {
                    await auth.signInWithEmailAndPassword(email, pwd);
                    closeModals();
                    showToast('Logged in!', 'success');
                } catch (err) { showToast(err.message, 'error'); }
            });

            safeOnClick('doSignupBtn', async () => {
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const pwd = document.getElementById('signupPassword').value;
                const roleRadios = document.querySelectorAll('input[name="role"]');
                let role = 'Buyer';
                roleRadios.forEach(r => { if (r.checked) role = r.value; });
                if (!name || !email || !pwd) {
                    showToast('Please fill all fields', 'warning');
                    return;
                }
                try {
                    const cred = await auth.createUserWithEmailAndPassword(email, pwd);
                    await cred.user.updateProfile({ displayName: name });
                    await db.collection('users').doc(cred.user.uid).set({ role, name, email });
                    closeModals();
                    showToast('Account created! You are a ' + role, 'success');
                } catch (err) { showToast(err.message, 'error'); }
            });

            document.querySelectorAll('.close').forEach(el => { el.onclick = closeModals; });
            window.onclick = (e) => { if (e.target.classList.contains('modal')) closeModals(); };

            safeOnClick('cartIcon', () => {
                renderCartModal();
                const modal = document.getElementById('cartModal');
                if (modal) modal.style.display = 'flex';
            });
            safeOnClick('cartModalClose', () => {
                const modal = document.getElementById('cartModal');
                if (modal) modal.style.display = 'none';
            });
            safeOnClick('orderModalClose', () => {
                const modal = document.getElementById('orderModal');
                if (modal) modal.style.display = 'none';
            });

            const postBtn = document.getElementById('postItemBtn');
            if (postBtn) {
                postBtn.onclick = async function() {
                    const title = document.getElementById('itemTitle').value.trim();
                    const desc = document.getElementById('itemDesc').value.trim();
                    const price = parseFloat(document.getElementById('itemPrice').value);
                    const sellerName = document.getElementById('sellerName').value.trim();
                    const sellerEmail = document.getElementById('sellerEmail').value.trim();
                    const sellerPhone = document.getElementById('sellerPhone').value.trim();
                    const files = document.getElementById('itemImages').files;
                    if (!title || !desc || isNaN(price) || !sellerName || !sellerEmail) {
                        showToast('Please fill all required fields', 'warning');
                        return;
                    }
                    this.disabled = true;
                    this.textContent = 'Uploading...';
                    try {
                        const images = await uploadImages(files);
                        await db.collection('listings').add({
                            title, description: desc, price,
                            seller: { name: sellerName, email: sellerEmail, phone: sellerPhone || '' },
                            userId: currentUser ? currentUser.uid : 'guest_' + Date.now(),
                            images,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        showToast('Item posted!', 'success');
                        document.getElementById('itemTitle').value = '';
                        document.getElementById('itemDesc').value = '';
                        document.getElementById('itemPrice').value = '';
                        document.getElementById('sellerName').value = '';
                        document.getElementById('sellerEmail').value = '';
                        document.getElementById('sellerPhone').value = '';
                        document.getElementById('itemImages').value = '';
                        document.getElementById('imagePreview').innerHTML = '';
                        loadListings();
                    } catch (err) { showToast(err.message, 'error'); }
                    this.disabled = false;
                    this.textContent = 'Post Item';
                };
            }

            const fileInput = document.getElementById('itemImages');
            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const preview = document.getElementById('imagePreview');
                    if (!preview) return;
                    preview.innerHTML = '';
                    Array.from(this.files).slice(0, 3).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = ev => {
                            const img = document.createElement('img');
                            img.src = ev.target.result;
                            preview.appendChild(img);
                        };
                        reader.readAsDataURL(file);
                    });
                });
            }

            // Live video
            const startBtn = document.getElementById('startLiveBtn');
            const joinBtn = document.getElementById('joinLiveBtn');
            const endBtn = document.getElementById('endLiveBtn');
            const fullBtn = document.getElementById('fullscreenBtn');
            const frame = document.getElementById('liveFrameContainer');
            const liveStatus = document.getElementById('liveStatus');
            const liveInfo = document.getElementById('liveInfo');
            let roomId = null;

            function loadVdo(rid, isHost) {
                if (!frame) return;
                frame.style.display = 'block';
                frame.innerHTML = `<iframe src="https://vdo.ninja/?room=${rid}${isHost ? '&push&label=Seller' : '&view'}" allow="camera;microphone;display-capture;autoplay;fullscreen" style="width:100%;height:100%;border:0;"></iframe>`;
                if (liveInfo) liveInfo.innerText = isHost ? `🔑 Room: ${rid} (share with buyers)` : `👀 Watching ${rid}`;
                if (liveStatus) liveStatus.innerText = isHost ? '🔴 You are LIVE' : '👀 Watching';
                if (startBtn) startBtn.style.display = 'none';
                if (joinBtn) joinBtn.style.display = 'none';
                if (endBtn) endBtn.style.display = 'inline-block';
                if (fullBtn) fullBtn.style.display = 'inline-block';
                roomId = rid;
            }

            if (startBtn) {
                startBtn.onclick = async function() {
                    if (!currentUser) { showToast('Please login to start', 'warning'); return; }
                    if (currentUserRole !== 'Seller') {
                        showToast('Only sellers can start a live stream.', 'warning');
                        return;
                    }
                    try {
                        await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        const rid = `hive_${Math.random().toString(36).substring(2, 10)}`;
                        loadVdo(rid, true);
                    } catch (e) { showToast('Camera access denied', 'error'); }
                };
            }
            if (joinBtn) {
                joinBtn.onclick = function() {
                    if (roomId) { loadVdo(roomId, false); return; }
                    const rid = prompt('Enter room ID:');
                    if (rid) loadVdo(rid.trim(), false);
                    else showToast('No room ID', 'warning');
                };
            }
            if (endBtn) {
                endBtn.onclick = function() {
                    if (frame) { frame.style.display = 'none'; frame.innerHTML = ''; }
                    roomId = null;
                    if (startBtn) startBtn.style.display = 'inline-block';
                    if (joinBtn) joinBtn.style.display = 'inline-block';
                    if (endBtn) endBtn.style.display = 'none';
                    if (fullBtn) fullBtn.style.display = 'none';
                    if (liveStatus) liveStatus.innerText = '⚡ Ready';
                    if (liveInfo) liveInfo.innerText = '';
                    showToast('Stream ended', 'info');
                };
            }
            if (fullBtn) {
                fullBtn.onclick = function() {
                    if (!frame) return;
                    if (frame.requestFullscreen) frame.requestFullscreen();
                    else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
                };
            }

            // Checkout
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) {
                checkoutBtn.onclick = function() {
                    if (!cart.length) { showToast('Cart is empty', 'warning'); return; }
                    if (!currentUser) { showToast('Please login to checkout', 'warning'); showModal('loginModal'); return; }
                    let msg = '🛒 *Order Summary from The Hive*%0A%0A';
                    let total = 0;
                    cart.forEach(item => {
                        const subtotal = item.price * (item.qty || 1);
                        total += subtotal;
                        msg += `📦 ${item.title} x ${item.qty} = KES ${subtotal.toFixed(2)}%0A`;
                    });
                    msg += `%0A💵 Total: KES ${total.toFixed(2)}%0A%0A`;
                    const name = prompt('Your full name:') || 'Customer';
                    const phone = prompt('Your phone (WhatsApp):') || '';
                    const address = prompt('Delivery address:') || '';
                    msg += `👤 ${name}%0A📞 ${phone}%0A📍 ${address}`;
                    if (cart.length && cart[0].sellerPhone) {
                        const sellerPhone = cart[0].sellerPhone.replace(/\D/g, '');
                        window.open(`https://wa.me/${sellerPhone}?text=${msg}`, '_blank');
                        db.collection('orders').add({
                            items: cart,
                            buyerName: name,
                            buyerPhone: phone,
                            address: address,
                            total: total,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).catch(() => {});
                        cart = [];
                        updateCartUI();
                        const modal = document.getElementById('cartModal');
                        if (modal) modal.style.display = 'none';
                        showToast('Order placed!', 'success');
                    } else {
                        showToast('Seller phone missing', 'error');
                    }
                };
            }

            // Place order
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            if (placeOrderBtn) {
                placeOrderBtn.onclick = function() {
                    const name = document.getElementById('orderBuyerName').value.trim();
                    const phone = document.getElementById('orderBuyerPhone').value.trim();
                    const address = document.getElementById('orderAddress').value.trim();
                    if (!name || !phone || !address) { showToast('Fill all fields', 'warning'); return; }
                    const msg = `🛒 *New Order from The Hive*%0A%0A📦 Item: ${currentOrder.title}%0A💰 Price: KES ${currentOrder.price}%0A👤 Buyer: ${name}%0A📞 Phone: ${phone}%0A📍 Address: ${address}%0A%0APlease confirm.`;
                    const sellerPhone = currentOrder.phone;
                    if (!sellerPhone) { showToast('Seller phone missing', 'error'); return; }
                    window.open(`https://wa.me/${sellerPhone.replace(/\D/g, '')}?text=${msg}`, '_blank');
                    db.collection('orders').add({
                        itemId: currentOrder.id,
                        itemTitle: currentOrder.title,
                        buyerName: name,
                        buyerPhone: phone,
                        address: address,
                        sellerName: currentOrder.seller,
                        sellerPhone: sellerPhone,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(() => {});
                    const modal = document.getElementById('orderModal');
                    if (modal) modal.style.display = 'none';
                    showToast('Order sent!', 'success');
                };
            }

            loadListings();
            updateCartUI();
        });

        const CLOUD_NAME = "dpsj8cuoq";
        const UPLOAD_PRESET = "marketplace";
        async function uploadImages(files) {
            if (!files.length) return [];
            const urls = [];
            for (let i = 0; i < Math.min(files.length, 3); i++) {
                const fd = new FormData();
                fd.append('file', files[i]);
                fd.append('upload_preset', UPLOAD_PRESET);
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
                if (!res.ok) throw new Error('Upload failed');
                const data = await res.json();
                urls.push(data.secure_url);
            }
            return urls;
        }

        function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }

        function loadListings() {
            db.collection('listings').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                const grid = document.getElementById('listingsGrid');
                if (!grid) return;
                if (snapshot.empty) { grid.innerHTML = '<p>No items yet.</p>'; return; }
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    const imagesHtml = data.images && data.images.length ?
                        `<div class="card-images">${data.images.map(img => `<img src="${img}">`).join('')}</div>` :
                        `<div class="card-images"><i class="fas fa-image"></i></div>`;
                    const sellerPhone = data.seller?.phone || '';
                    html += `
                    <div class="card" data-id="${id}">
                        ${imagesHtml}
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(data.title)}</div>
                            <div class="card-price">KES ${data.price}</div>
                            <div class="card-desc">${escapeHtml(data.description.substring(0, 80))}</div>
                            <div class="seller-info">
                                <i class="fas fa-user"></i> ${escapeHtml(data.seller?.name)}<br>
                                <i class="fas fa-envelope"></i> ${escapeHtml(data.seller?.email)}<br>
                                ${sellerPhone ? `<i class="fas fa-phone"></i> ${escapeHtml(sellerPhone)}` : ''}
                            </div>
                            <div class="card-actions">
                                <button class="btn-add-cart" data-id="${id}" data-title="${escapeHtml(data.title)}" data-price="${data.price}" data-seller="${escapeHtml(data.seller?.name)}" data-phone="${escapeHtml(sellerPhone)}"><i class="fas fa-cart-plus"></i> Add</button>
                                <button class="btn-buy" data-id="${id}" data-title="${escapeHtml(data.title)}" data-price="${data.price}" data-seller="${escapeHtml(data.seller?.name)}" data-phone="${escapeHtml(sellerPhone)}"><i class="fas fa-bolt"></i> Buy</button>
                                ${sellerPhone ? `<button class="btn-whatsapp" data-phone="${escapeHtml(sellerPhone)}" data-title="${escapeHtml(data.title)}" data-price="${data.price}" data-seller="${escapeHtml(data.seller?.name)}"><i class="fab fa-whatsapp"></i> Chat</button>` : ''}
                            </div>
                        </div>
                    </div>`;
                });
                grid.innerHTML = html;
                document.querySelectorAll('.btn-add-cart').forEach(b => {
                    b.onclick = function() {
                        addToCart({ id: this.dataset.id, title: this.dataset.title, price: parseFloat(this.dataset.price) });
                    };
                });
                document.querySelectorAll('.btn-buy').forEach(b => {
                    b.onclick = function() {
                        openOrderModal(this.dataset.id, this.dataset.title, this.dataset.price, this.dataset.seller, this.dataset.phone);
                    };
                });
                document.querySelectorAll('.btn-whatsapp').forEach(b => {
                    b.onclick = function() {
                        const phone = this.dataset.phone;
                        if (!phone) { showToast('No phone number', 'warning'); return; }
                        const msg = `Hello ${this.dataset.seller}, I'm interested in "${this.dataset.title}" for KES ${this.dataset.price}.`;
                        window.open(`https://wa.me/${phone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
                    };
                });
            });
        }

        let currentOrder = {};
        function openOrderModal(id, title, price, seller, phone) {
            if (!currentUser) { showToast('Please login to order', 'warning'); showModal('loginModal'); return; }
            document.getElementById('orderBuyerName').value = currentUser.displayName || '';
            document.getElementById('orderBuyerPhone').value = '';
            document.getElementById('orderAddress').value = '';
            currentOrder = { id, title, price, seller, phone };
            document.getElementById('orderSummary').innerHTML = `<strong>Item:</strong> ${title}<br><strong>Price:</strong> KES ${price}<br><strong>Seller:</strong> ${seller}`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        auth.onAuthStateChanged(user => { updateAuthUI(user); loadListings(); });
    </script>
</body>
