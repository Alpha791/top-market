<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>The Hive 🐝</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Cloudinary Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <header>
        <div class="logo"><i class="fas fa-store"></i> The Hive</div>
        <div class="auth-buttons">
            <button id="showLoginBtn" class="btn-outline">Login</button>
            <button id="showSignupBtn" class="btn-outline">Sign Up</button>
            <div id="userInfo" style="display:none;">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn-sm">Logout</button>
            </div>
        </div>
    </header>
    <main>
        <!-- Live Section (Vdo.ninja) -->
        <section class="live-section">
            <h2><i class="fas fa-video"></i> Live Selling</h2>
            <div class="live-container">
                <div id="liveFrameContainer" class="live-frame-container" style="display: none;"></div>
                <div class="live-controls">
                    <button id="startLiveBtn" class="btn-primary live-btn">🔴 Start Live Selling</button>
                    <button id="joinLiveBtn" class="btn-primary live-btn">👁️ Join Live Stream</button>
                    <button id="endLiveBtn" class="btn-danger live-btn" style="display:none;">⏹️ End Stream</button>
                    <button id="fullscreenBtn" class="btn-secondary live-btn" style="display:none;">⛶ Fullscreen</button>
                </div>
                <div id="liveStatus" class="live-status">⚡ Ready</div>
                <div id="liveInfo" class="live-info"></div>
            </div>
        </section>

        <!-- Sell Item Form -->
        <section class="post-form">
            <h2><i class="fas fa-plus-circle"></i> Sell an Item</h2>
            <div class="form-card">
                <input type="text" id="itemTitle" placeholder="Title *">
                <textarea id="itemDesc" placeholder="Description *" rows="3"></textarea>
                <input type="number" id="itemPrice" placeholder="Price (KES) *">
                <input type="text" id="sellerName" placeholder="Your Name *">
                <input type="email" id="sellerEmail" placeholder="Your Email *">
                <input type="tel" id="sellerPhone" placeholder="Phone (WhatsApp) *">
                <label class="file-label"><i class="fas fa-cloud-upload-alt"></i> Up to 3 images</label>
                <input type="file" id="itemImages" accept="image/*" multiple>
                <div id="imagePreview" class="image-preview"></div>
                <button id="postItemBtn" class="btn-primary">Post Item</button>
            </div>
        </section>

        <!-- Listings Grid -->
        <section class="listings">
            <h2><i class="fas fa-list-ul"></i> Available Items</h2>
            <div id="listingsGrid" class="listings-grid">Loading items...</div>
        </section>
    </main>

    <!-- Auth Modals -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Login</h3>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="doLoginBtn">Login</button>
        </div>
    </div>
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Create Account</h3>
            <input type="text" id="signupName" placeholder="Full Name">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <button id="doSignupBtn">Sign Up</button>
        </div>
    </div>

    <!-- Order Modal (NEW) -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" id="orderModalClose">&times;</span>
            <h3><i class="fas fa-shopping-cart"></i> Place Order</h3>
            <input type="text" id="orderBuyerName" placeholder="Your Full Name *" required>
            <input type="tel" id="orderBuyerPhone" placeholder="Your Phone (WhatsApp) *" required>
            <input type="text" id="orderAddress" placeholder="Delivery Address *" required>
            <input type="number" id="orderQuantity" placeholder="Quantity" value="1" min="1">
            <div id="orderSummary" style="margin: 10px 0; color: #d4af7a;"></div>
            <button id="placeOrderBtn" class="btn-primary">📲 Place Order via WhatsApp</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
